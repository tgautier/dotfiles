# claude-code is the only review agent, because it is the only one with a paid
# subscription behind it. copilot, codex and gemini/antigravity are all installed
# — this is not an availability problem. They have no API credit: codex fails with
# `401 Unauthorized: Missing bearer or basic authentication`, and copilot/gemini
# are not exposed on PATH under those names. So a second agent is not one install
# away, and "cross-model convergence" is not a goal to engineer toward here.
#
# This previously read `agent = "copilot"`. roborev could not invoke it, so every
# review silently fell through to backup_agent: 112 of 112 jobs on record ran
# claude-code. Naming claude-code directly makes the ledger match the config;
# backup_agent stays set, so the fallback is now a no-op duplicate of the primary
# rather than a silent substitution. It is kept deliberately rather than deleted:
# it gives a future second agent an obvious slot, and a duplicate cannot silently
# substitute a different model the way `copilot` -> `claude-code` did.
#
# The `codex` and `copilot-cli` casks in Brewfile stay — those tools are wanted
# for interactive use. They are deliberately not review agents, so do not
# "reconcile" the Brewfile against this file.
#
# Do not run `roborev check-agents` to inspect any of this: it invokes every
# configured agent and launches auth/login flows for the uncredentialed ones.
# Read this file and use `command -v` instead.
agent = "claude-code"
backup_agent = "claude-code"
review_reasoning = "thorough"

excluded_branches = ["main"]

review_guidelines = '''
Dotfiles repo: cross-platform shell config, Homebrew, mise, tmux, git config. The global Claude Code config (rules, skills, hooks) lives in the companion private repo and is NOT in this tree.

HARD INVARIANTS — flag violations as blockers:

1. Secrets: never commit credentials, tokens, API keys, or secrets. This repo is public on GitHub.
2. Personal/sensitive content: never include PII, employer name, colleague names, broker/financial figures, internal product/project names, or memory-file references that hint at sensitive content. Examples and placeholders count. This repo is public.
3. Shell compatibility: Claude Code's Bash tool passes through zsh, which corrupts `!` to `\!` in file content. Files must not contain `\!` — flag any occurrence as corruption.
4. Cross-platform: any shell, tmux, or tool config change must consider macOS, Linux, and WSL2. Guard platform-specific code with `$PLATFORM` checks. Brewfile edits must be mirrored in `Brewfile.linux` for CLI tools.
5. Project-local rule (`.claude/rules/brewfile.md`): dual-Brewfile sync + alphabetical sorting inside sections.

SCOPE CONTEXT — understand before flagging:

- rcup symlinks: tracked files are symlinked into $HOME by rcm based on `rcrc`. Both this repo and `dotfiles-private` are merged via `DOTFILES_DIRS`.
- Versioning: SemVer and changelog policy are defined in the global Claude Code config (in `dotfiles-private`) and auto-load via rcm. Don't expect a `versioning.md` file in this repo's tree.
- CI: `just ci` runs shell, markdown, Brewfile, mise, and Justfile lints — the same checks run in GitHub Actions.

DO NOT FLAG:

- Shell scripts using `jq` for JSON parsing — `jq` is expected to be available on macOS/Linux
- Brewfile lines that look long — keep them as written, alphabetically sorted within their section
'''
