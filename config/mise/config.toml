[settings]
not_found_auto_install = true
trusted_config_paths = ["~/Workspace/tgautier"]

[tools]
chezmoi = "2.73.1"
dart = { version = "3.13.5", url = "https://storage.googleapis.com/dart-archive/channels/stable/release/{{ version }}/sdk/dartsdk-{{ os() }}-{{ arch() }}-release.zip", version_list_url = "https://storage.googleapis.com/storage/v1/b/dart-archive/o?prefix=channels/stable/release/&delimiter=/", version_regex = 'channels/stable/release/(\d+\.\d+\.\d+)/', version_expr = 'fromJSON(body).prefixes | filter({ # matches "^channels/stable/release/(\\d+\\.\\d+\\.\\d+)/$" }) | map({split(#, "/")[3]}) | sortVersions()' }
deno = "2.9.7"
# elixir's -otp-N suffix must match erlang's OTP major. Bump these two as a
# pair, never independently.
elixir = "1.20.4-otp-29"
erlang = "29.1"
"vfox:mise-plugins/vfox-flutter" = "3.47.7"
go = "1.27.2"
helm = "4.3.0"
node = "26"
python = "3.15.0"
ruby = "4.0.7"
yarn = "4.18.1"
yq = "4.54.1"
