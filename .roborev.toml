# Claude Code is the configured reviewer by operator decision. Keep review
# execution single-agent: an empty backup fails clearly instead of substituting
# another model.
#
# Check installation with `command -v <binary>`. Do not run
# `roborev check-agents`; it invokes every configured agent and may launch
# authentication flows.
agent = "claude-code"
model = "claude-opus-4-6"
backup_agent = ""
review_reasoning = "medium"

excluded_branches = ["main"]

review_guidelines = '''
Dotfiles repo: cross-platform shell config, Homebrew, mise, tmux, git config. The global Claude Code config (rules, skills, hooks) lives in the companion private repo and is NOT in this tree.

HARD INVARIANTS — flag violations as blockers:

1. Secrets: never commit credentials, tokens, API keys, or secrets. This repo is public on GitHub.
2. Personal/sensitive content: never include PII, employer name, colleague names, broker/financial figures, internal product/project names, or memory-file references that hint at sensitive content. Examples and placeholders count. This repo is public. The repository owner's public author identity, `Thomas Gautier <thomas@gautier.gg>`, is the sole explicit exception when Git integrity checks require it.
3. Shell compatibility: Claude Code's Bash tool passes through zsh, which corrupts `!` to `\!` in file content. Files must not contain `\!` — flag any occurrence as corruption.
4. Cross-platform: any shell, tmux, or tool config change must consider macOS, Linux, and WSL2. Guard platform-specific code with `$PLATFORM` checks. Brewfile edits must be mirrored in `Brewfile.linux` for CLI tools.
5. Project-local rule (`.claude/rules/brewfile.md`): dual-Brewfile sync + alphabetical sorting inside sections.

SCOPE CONTEXT — understand before flagging:

- rcup symlinks: tracked files are symlinked into $HOME by rcm based on `rcrc`. Both this repo and `dotfiles-private` are merged via `DOTFILES_DIRS`. Their paths default to `$HOME/Workspace/tgautier/` and are overridable with `DOTFILES_DIR` / `DOTFILES_PRIVATE_DIR`, a contract shared by `rcrc`, the `Justfile` vars, and `_scan-stale-symlinks`.
- Versioning: SemVer and changelog policy are defined in the global Claude Code config (in `dotfiles-private`) and auto-load via rcm. Don't expect a `versioning.md` file in this repo's tree.
- CI: `just ci` runs the authoritative local repository checks. GitHub Actions is disabled. `just ci-attest` binds the complete gate to the exact unchanged clean `HEAD`, pre-push requires that evidence before transfer, and `just ci-publish` verifies the pushed SSH tip before publishing the branch-protection status.

DO NOT FLAG:

- Shell scripts using `jq` for JSON parsing — `jq` is expected to be available on macOS/Linux
- Brewfile lines that look long — keep them as written, alphabetically sorted within their section
'''
