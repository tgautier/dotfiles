[settings]
not_found_auto_install = true
trusted_config_paths = ["~/Workspace/tgautier"]

[tools]
chezmoi = "2.73.3"
deno = "2.9.8"
# elixir's -otp-N suffix must match erlang's OTP major. Bump these two as a
# pair, never independently.
elixir = "1.20.5-otp-29"
erlang = "29.1.2"
go = "1.27.3"
helm = "4.3.1"
# jq and shellcheck are also in the Brewfiles, but projects pin them in mise
# too, which creates global shims ahead of Homebrew on PATH. A shim with no
# active version refuses to run, so pin them here to resolve everywhere.
jq = "1.8.2"
node = "26"
python = "3.15.2"
ruby = "4.0.9"
shellcheck = "0.11.0"
yarn = "4.18.1"
yq = "4.54.1"
